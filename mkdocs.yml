site_name: Redes Neurais — Portfólio
site_description: Exercícios e projetos da disciplina de Redes Neurais.
site_url: https://joao-gabriel05.github.io/data-redes_neurais/
repo_url: https://github.com/Joao-Gabriel05/data-redes_neurais
repo_name: data-redes_neurais
edit_uri: ""

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tema claro

nav:
  - Início: index.md
  - Exercícios:
      - Dados: exercises/data/index.md
      - Perceptron: exercises/perceptron/index.md
      - MLP: exercises/mlp/index.md
      - VAE: exercises/vae/index.md
  - Projetos: projects/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Joao-Gabriel05
